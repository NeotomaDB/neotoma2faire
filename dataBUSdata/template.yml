apiVersion: neotoma v2.0
headers: 2
kind: Development 
metadata:
# Constants
- column: datasettypeid
  neotoma: ndb.datasettypes.datasettypeid
  required: true
  value: Metabarcoding aeDNA
- column: databaseid
  neotoma: 'ndb.datasetdatabases.databasename'
  required: true
  value: Sedimentary aDNA Database

### Sites
- column: siteid
  neotoma: ndb.sites.siteid
  rowwise: false
  type: string
- column: sitename
  neotoma: ndb.sites.sitename
  rowwise: false
  type: string
- column: cu_notes
  neotoma: ndb.collectionunits.notes
  required: false
  rowwise: false
  type: str
- column: handle
  neotoma: ndb.collectionunits.collunitname
  notes: name by author
  overwrite: true
  required: false
  rowwise: false
  type: string
- column: handle
  neotoma: ndb.collectionunits.handle
  overwrite: true
  required: false
  rowwise: false
  type: string
- column: PlotDepth(cm)
  neotoma: ndb.analysisunits.depth
  required: false
  rowwise: true
  type: float
- column: Thickness(cm)
  neotoma: ndb.analysisunits.thickness
  required: false
  rowwise: true
  type: float

## Chronologies
- column: AgeModel
  neotoma: ndb.chronologies.agemodel
  required: false
  rowwise: false
  type: string
  chronologyname: DefaultChronology

- column: AgeType
  neotoma: ndb.chronologies.agetypeid
  required: false
  rowwise: false
  type: string
  chronologyname: DefaultChronology

- column: CRS(CalendarYear)
  neotoma: ndb.chronologies.ageboundolder
  required: false
  rowwise: true
  type: float
  chronologyname: DefaultChronology

- column: CRS(CalendarYear)
  neotoma: ndb.chronologies.ageboundyounger
  required: false
  rowwise: true
  type: float
  chronologyname: DefaultChronology


# ── Geochronology ─────────────────────────────────────────────────────────────
# - column: CRS(CalendarYear)
#   neotoma: ndb.geochronology.age
#   required: false
#   rowwise: true
#   type: float

# - column: geochrontype
